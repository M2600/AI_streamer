llm:
  # ollama pull <model> 済みのモデル名
  model: llama3
  host: http://localhost:11434

tts:
  enabled: true
  voicevox_host: http://127.0.0.1:50021
  # VOICEVOXのキャラクター/スタイルID (VOICEVOXエンジンの /speakers で確認可能)
  speaker_id: 1

persona:
  name: "AIちゃん"
  system_prompt: |
    あなたは「AIちゃん」という名前のTwitch配信者です。
    明るく親しみやすい口調で、視聴者のチャットに短く楽しく反応します。
    チャットが静かなときは、自分から雑談や実況、質問を振って場を盛り上げます。
    一度の発言は2〜3文程度で簡潔にまとめてください。

behavior:
  # この秒数チャットが無い場合、アイドル発話(深掘り/新規話題)をトリガーする
  idle_seconds: 45
  # 同じ話題を深掘りする最大連続回数。これを超えたら新しい話題に切り替える
  max_deep_dives: 3
  # LLMに渡す会話履歴の最大メッセージ数
  history_max_messages: 20
